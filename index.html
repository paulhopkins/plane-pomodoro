<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A pomodoro timer where every focus session is a flight." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23f2b544' d='M16 2l3 10 11 6v3l-11-3-1 7 4 3v2l-6-2-6 2v-2l4-3-1-7-11 3v-3l11-6z'/%3E%3C/svg%3E" />
    <title>Plane Pomodoro</title>
    <!-- Keep the page dark and hidden until the stylesheet arrives (no flash of unstyled content). -->
    <style>html, body { background: #15171c; margin: 0; } #app { visibility: hidden; }</style>
  </head>
  <body>
    <div id="app" data-view="seat">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">✈</span> Plane Pomodoro</div>
        <div class="topbar-actions">
          <button id="btn-view" class="btn pill" title="Switch view (V)">Window view</button>
          <button id="btn-sound" class="btn icon" title="Sound on/off (M)" aria-label="Toggle sound">🔊</button>
          <button id="btn-settings" class="btn icon" title="Settings" aria-label="Settings">⚙</button>
        </div>
      </header>

      <section class="view view-window" aria-label="Window view">
        <canvas id="scene"></canvas>
        <div class="hud">
          <div class="hud-pill">
            <span id="hud-route" class="hud-route"></span>
            <span id="hud-time" class="hud-time"></span>
            <span id="hud-phase" class="hud-phase"></span>
            <button id="hud-toggle" class="btn tiny">Start</button>
          </div>
          <div class="hud-hint">Click a window to pull the shade · Scroll or pinch to zoom · <kbd>V</kbd> seat-back screen</div>
        </div>
      </section>

      <section class="view view-seat" aria-label="Seat-back view">
        <div class="seatback">
          <div class="headrest"></div>
          <div class="ife">
            <div class="ife-top">
              <span id="ife-flight" class="ife-flight"></span>
              <span id="ife-route" class="ife-route"></span>
              <span id="seatbelt" class="seatbelt" title="Fasten seatbelt sign">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4.5" r="2.5"/><path d="M7 9h10v6h-2v7h-2v-6h-2v6H9v-7H7z"/><path d="M5 14h14v2H5z" class="belt"/></svg>
                <span>Fasten seatbelt</span>
              </span>
            </div>
            <div class="ife-main">
              <div class="ife-timer">
                <div id="ife-mode" class="ife-mode"></div>
                <div id="ife-clock" class="ife-clock">25:00</div>
                <div id="ife-phase" class="ife-phase"></div>
                <div class="ife-progress"><div id="ife-bar"></div><div id="ife-markers" class="ife-markers"></div></div>
              </div>
              <div class="ife-map"><svg id="map" aria-label="Moving map"></svg></div>
            </div>
            <div class="ife-stats">
              <div><label>Altitude</label><span id="st-alt">—</span></div>
              <div><label>Ground speed</label><span id="st-gs">—</span></div>
              <div><label>Outside air</label><span id="st-temp">—</span></div>
              <div><label>Distance to go</label><span id="st-dist">—</span></div>
              <div><label id="st-local-label">Local time</label><span id="st-local">—</span></div>
            </div>
          </div>
          <div class="seat-pocket"><span>Safety information · Please read before departure</span></div>
        </div>
        <div class="tray">
          <div class="tray-row">
            <div class="tray-controls">
              <button id="btn-start" class="btn primary">Depart</button>
              <button id="btn-skip" class="btn">Skip</button>
              <button id="btn-reset" class="btn">Reset</button>
            </div>
            <div class="legs" id="legs" aria-label="Sessions in this cycle"></div>
          </div>
          <div class="tasks">
            <form id="task-form" autocomplete="off">
              <input id="task-input" maxlength="120" placeholder="What are you working on this flight?" />
            </form>
            <ul id="task-list"></ul>
          </div>
          <div class="cup" aria-hidden="true"></div>
        </div>
      </section>

      <dialog id="settings">
        <form method="dialog" id="settings-form">
          <h2 id="settings-title">Flight settings</h2>
          <div class="route">
            <label>Departing from <select name="from"></select></label>
            <span class="route-arrow" aria-hidden="true">✈</span>
            <label>Flying to <select name="to"></select></label>
          </div>
          <p id="route-note" class="route-note"></p>
          <div class="grid">
            <label>Focus flight <span><input type="number" name="focus" min="1" max="180" step="1" /> min</span></label>
            <label>Short break <span><input type="number" name="shortBreak" min="1" max="60" step="1" /> min</span></label>
            <label>Long break <span><input type="number" name="longBreak" min="1" max="120" step="1" /> min</span></label>
            <label>Long break every <span><input type="number" name="longEvery" min="2" max="10" step="1" /> flights</span></label>
            <label>Volume <input type="range" name="volume" min="0" max="1" step="0.05" /></label>
            <label class="check"><input type="checkbox" name="announcements" /> Cabin announcements</label>
            <label class="check"><input type="checkbox" name="autoStartBreaks" /> Start breaks automatically</label>
            <label class="check"><input type="checkbox" name="autoStartFocus" /> Board next flight automatically</label>
          </div>
          <div class="dialog-actions">
            <button value="close" class="btn">Done</button>
            <button type="button" id="btn-board" class="btn primary">Board now</button>
          </div>
        </form>
      </dialog>

      <div id="debug" class="debug" hidden>
        <label>Progress <input id="dbg-progress" type="range" min="0" max="1000" value="0" /></label>
        <label><input id="dbg-override" type="checkbox" /> override</label>
        <label>Sun <input id="dbg-sun" type="range" min="-20" max="60" value="30" /></label>
        <label><input id="dbg-sun-override" type="checkbox" /> override</label>
        <select id="dbg-from"></select> → <select id="dbg-to"></select>
        <span id="dbg-readout"></span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
